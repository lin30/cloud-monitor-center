<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Light · 云端监控中心</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="eyebrow">LIGHT · SIMULATION DASHBOARD</div>
      <h1>云端监控中心</h1>
      <div id="snapshotMeta" class="meta">正在读取最新快照…</div>
    </div>
    <div class="header-tools">
      <label class="search-box">
        <span>搜索</span>
        <input id="tableSearch" type="search" autocomplete="off" placeholder="标的 / 代码 / 赛道">
      </label>
      <div class="guard"><span class="dot"></span><span>模拟盘 · 仅研究</span></div>
    </div>
  </header>

  <nav id="nav" class="nav" aria-label="主导航"></nav>

  <main id="app">
    <section class="card loading">
      <h2>读取最新数据</h2>
      <p>页面固定，数据来自 dashboard/current.json。</p>
    </section>
  </main>

  <footer>
    <span>Light 模拟盘 · 不连接真实交易账户 · 不自动下单</span>
    <span id="snapshotHash"></span>
  </footer>

  <script src="./app.js" defer></script>
</body>
</html>
